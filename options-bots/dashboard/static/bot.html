<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Detail</title>
<link rel="icon" href="avatars/atlas.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.back { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.back span { transition: transform .25s; } .back:hover span { transform: translateX(-4px); }
.hero-bot { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; margin-bottom: 14px; padding: 22px; }
.hero-bot::after { content: ""; position: absolute; left: -120px; top: -160px; width: 460px; height: 460px; border-radius: 50%;
  background: radial-gradient(circle, var(--c), transparent 65%); opacity: .18; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.hero-bot .avatar { width: 120px; height: 120px; }
.hero-bot .avatar img { border-radius: 30px; }
.hero-bot .avatar .halo { border-radius: 36px; }
.hero-bot .bot-name { font-size: 34px; letter-spacing: .14em; }
.hero-bot .price { text-align: right; }
.hero-bot .price .v { font-size: 30px; font-weight: 700; }
.kpis6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px; }
.bars { display: grid; gap: 10px; margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 74px; gap: 10px; align-items: center; font-size: 12px; }
.bar-track { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--c); width: var(--w); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes grow { from { width: 0; } }
.wl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.wl .stat .v { font-size: 18px; }
.positions { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; margin-bottom: 14px; }
.payoff { height: 190px; margin: 6px 0 4px; position: relative; }
.payoff svg { width: 100%; height: 100%; display: block; overflow: visible; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.facts .stat .v { font-size: 14px; }
.filters { display: flex; gap: 6px; margin: 8px 0 10px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .2s; }
.filters button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--text-primary); border-color: color-mix(in srgb, var(--c) 55%, transparent); }
.hist-wrap { overflow-x: auto; }
.hist tbody tr { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(min(var(--i), 20) * 25ms); }
.hist td { white-space: nowrap; }
.feed.slim .row { grid-template-columns: 130px 1fr; }
.not-found { text-align: center; padding: 60px 16px; }
@media (max-width: 1000px) { .kpis6 { grid-template-columns: repeat(3, 1fr); } .two { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .hero-bot { grid-template-columns: auto 1fr; } .hero-bot .price { grid-column: 1 / -1; text-align: left; }
  .hero-bot .avatar { width: 84px; height: 84px; } .hero-bot .bot-name { font-size: 24px; }
  .kpis6 { grid-template-columns: repeat(2, 1fr); } .positions { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: repeat(2, 1fr); } .bar-row { grid-template-columns: 90px 1fr 64px; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="grid"></div></div>
<div class="wrap" id="page">
  <header class="topbar">
    <a class="back" href="./"><span aria-hidden="true">←</span> All bots</a>
    <div class="top-right">
      <span class="pill" id="market"><span class="live-dot"></span><span>Market</span></span>
      <span class="pill" id="updated"><span class="live-dot on mk-open"></span><span>Connecting…</span></span>
      <button class="theme" id="theme" type="button" aria-label="Toggle color theme">◐</button>
    </div>
  </header>
  <div id="logo" hidden></div>
  <main id="main"></main>
</div>

<script src="app.js"></script>
<script>
const BOT = new URLSearchParams(location.search).get("bot") || "atlas";
let last = null, built = false, filter = "all";
const seenPos = new Set();   // animate a position card only the first time it appears
window.onThemeChange = () => last && render(last);

function build(b) {
  document.title = `${b.title} · ${b.underlying}`;
  $("#favicon").href = `avatars/${b.name}.svg`;
  $("#page").style.setProperty("--c", botColor(b.name));
  $("#main").innerHTML = `
    <section class="panel hero-bot enter" style="--c:${botColor(b.name)}">
      <div class="avatar" style="--i:0"><div class="halo"></div><img src="avatars/${esc(b.name)}.svg" alt=""></div>
      <div>
        <div class="bot-name">${esc(b.title)}<span class="chip">${esc(b.underlying)}</span></div>
        <div class="tagline">${esc(b.tagline)}</div>
        <div class="strategy">${esc(b.strategy)}</div>
        <div data-f="status"></div>
      </div>
      <div class="price"><div class="k sub">${esc(b.underlying)} last seen</div><div class="v num" data-f="price">—</div><div class="sub" data-f="signal-dir"></div></div>
    </section>

    <section class="kpis6">
      ${[["realized", "Realized P&L"], ["unrealized", "Open P&L"], ["win", "Win rate"], ["pf", "Profit factor"], ["dd", "Max drawdown"], ["hold", "Avg hold"]]
        .map(([k, l], i) => `<div class="panel kpi enter" style="--i:${i + 1}"><div class="k">${l}</div><div class="v num" data-f="k-${k}">—</div><div class="d muted" data-f="d-${k}"></div></div>`).join("")}
    </section>

    <section class="two">
      <div class="panel enter" style="--i:7">
        <h2>Cumulative realized P&amp;L</h2>
        <div class="sub">Dollars, at each closed trade</div>
        <div class="chart" id="cum-chart"></div>
      </div>
      <div class="panel enter" style="--i:8">
        <h2>How trades ended</h2>
        <div class="sub">Count of closed trades by exit reason, with their total P&amp;L</div>
        <div class="bars" data-f="reasons"></div>
        <div class="wl" data-f="wl"></div>
      </div>
    </section>

    <section class="panel enter" style="--i:9;margin-bottom:14px">
      <h2>Signal right now</h2>
      <div class="sub">What the bot saw at its last check (completed daily bars)</div>
      <div data-f="signal" style="margin-top:10px"></div>
    </section>

    <h2 style="margin:6px 2px 10px">Open positions <span class="muted" data-f="open-count"></span></h2>
    <section class="positions" data-f="positions"></section>

    <section class="panel enter" style="--i:10;margin-bottom:14px">
      <h2>Trade history</h2>
      <div class="filters" role="group" aria-label="Filter trades">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="win" aria-pressed="false">Wins</button>
        <button type="button" data-filter="loss" aria-pressed="false">Losses</button>
      </div>
      <div class="hist-wrap" data-f="history"></div>
    </section>

    <section class="panel enter" style="--i:11">
      <h2>${esc(b.title)} activity</h2>
      <div class="feed slim" data-f="events"></div>
    </section>`;
  document.querySelectorAll("[data-filter]").forEach((btn) => btn.onclick = () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
    renderHistory(last);
  });
  built = true;
}

const F = (k) => $(`[data-f="${k}"]`);
const days = (v) => v == null ? "—" : v < 1 ? Math.round(v * 24) + "h" : v.toFixed(1) + "d";
const STATUS = { trading: "Trading", "market closed": "Market closed", paused: "Paused", stale: "No heartbeat", offline: "Offline" };

function render(b) {
  last = b;
  if (!built) build(b);
  $("#updated").className = "pill mk-open";
  setHTML($("#updated"), `<span class="live-dot on mk-open"></span><span>Live · <span class="mono">${new Date().toLocaleTimeString()}</span></span>`);
  const st = b.status === "market closed" ? "closed" : b.status;
  $(".hero-bot").classList.toggle("is-trading", b.status === "trading");
  setHTML(F("status"), `<span class="status st-${esc(st)}"><span class="live-dot ${b.status === "trading" ? "on" : ""}"></span>${esc(STATUS[b.status] ?? b.status)} · ${b.open.length} open · max ${b.rules.max_open}</span>`);
  const price = b.detail?.price ?? b.detail?.signal?.close;
  tween(F("price"), price ?? null, (v) => "$" + v.toFixed(2), { flash: true });
  const dir = b.detail?.signal?.direction;
  setHTML(F("signal-dir"), dir ? `<span class="sig-dir on" style="--c:${botColor(b.name)}">${esc(dir)} setup</span>` : `<span class="muted">no setup</span>`);

  const a = b.analytics, s = b.stats;
  const kr = F("k-realized"); tween(kr, s.realized, (v) => usd(v, true)); kr.className = "v num " + cls(s.realized);
  F("d-realized").textContent = `${s.trades} closed trades`;
  const ku = F("k-unrealized"); tween(ku, s.unrealized, (v) => usd(v, true)); ku.className = "v num " + cls(s.unrealized);
  F("d-unrealized").textContent = `max risk ${usd(a.open_risk)}`;
  tween(F("k-win"), s.win_rate == null ? null : s.win_rate * 100, (v) => Math.round(v) + "%", { flash: false });
  F("d-win").textContent = s.trades ? `${s.wins} W / ${s.trades - s.wins} L` : "no trades yet";
  tween(F("k-pf"), a.profit_factor, (v) => v.toFixed(2), { flash: false });
  F("d-pf").textContent = a.expectancy == null ? "gross win ÷ gross loss" : `${usd(a.expectancy, true)} per trade`;
  const kd = F("k-dd"); tween(kd, a.max_drawdown, (v) => usd(v, true), { flash: false }); kd.className = "v num " + (a.max_drawdown < 0 ? "neg" : "");
  F("d-dd").textContent = "worst peak-to-trough";
  F("k-hold").textContent = days(a.avg_hold_days);
  F("d-hold").textContent = "open → close";

  const curve = b.curve.map((p) => ({ x: Date.parse(p.t), y: p.v }));
  lineChart($("#cum-chart"), [{ label: b.title, color: botColor(b.name), points: curve }], { step: true, area: true, emptyText: "No closed trades yet" });

  const reasons = Object.entries(a.exit_reasons).sort((x, y) => y[1].count - x[1].count);
  const maxC = Math.max(1, ...reasons.map(([, r]) => r.count));
  setHTML(F("reasons"), reasons.length ? reasons.map(([k, r], i) =>
    `<div class="bar-row"><span>${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="--w:${r.count / maxC * 100}%;--i:${i}"></div></div>
     <span class="mono ${cls(r.pnl)}" style="text-align:right">${r.count}× ${usd(r.pnl, true)}</span></div>`).join("") : `<div class="none">No closed trades yet</div>`);
  setHTML(F("wl"), `
    <div class="stat"><div class="k">Avg win</div><div class="v num pos">${usd(a.avg_win, true)}</div><div class="muted mono" style="font-size:11px">best ${usd(a.best, true)}</div></div>
    <div class="stat"><div class="k">Avg loss</div><div class="v num neg">${usd(a.avg_loss, true)}</div><div class="muted mono" style="font-size:11px">worst ${usd(a.worst, true)}</div></div>`);

  const sig = b.detail?.signal || {};
  const keys = Object.entries(sig).filter(([k, v]) => !["direction", "checked_at", "blocked", "forced"].includes(k) && v != null);
  const fmt = (v) => typeof v === "number" ? (Math.abs(v) < 1 ? v.toFixed(3) : v.toFixed(2)) : v;
  setHTML(F("signal"), keys.length || sig.blocked ? `<div class="signal">${keys.map(([k, v]) => `<span class="sig-kv">${esc(k)} <b class="mono">${esc(fmt(v))}</b></span>`).join("")}</div>
    ${sig.checked_at ? `<div class="muted" style="font-size:12px">Checked ${esc(sig.checked_at.slice(0, 16).replace("T", " "))} ET</div>` : ""}
    ${sig.blocked ? `<div class="signal muted">Blocked: ${esc(sig.blocked)}</div>` : ""}` : `<div class="none">The bot hasn't checked for a setup yet (it checks between 10:00 and 15:30 ET).</div>`);

  F("open-count").textContent = `(${b.open.length})`;
  const posHTML = b.open.length ? b.open.map((p, i) => positionCard(p, b, price, i)).join("") :
    `<div class="panel"><div class="none">No open positions. ${esc(b.title)} opens one when its setup appears.</div></div>`;
  if (setHTML(F("positions"), posHTML)) b.open.forEach((p) => drawPayoff(document.getElementById("payoff-" + p.id), p, b, price, !seenPos.has(p.id)));
  b.open.forEach((p) => seenPos.add(p.id));

  renderHistory(b);
  setHTML(F("events"), b.events.length ? b.events.map((e) => `<div class="row lv-${esc(e.level)}"><div class="muted mono">${fmtTime(e.ts)}</div><div class="msg">${esc(e.message)}</div></div>`).join("") : `<div class="none">No activity yet.</div>`);
}

function legsText(p) { return p.legs.map((l) => `${l.side === "sell" ? "−" : "+"}${l.strike}${l.kind[0].toUpperCase()}`).join(" "); }

/** P&L in dollars at expiration if the underlying finishes at S. */
function payoffAt(p, S) {
  const v = p.legs.reduce((a, l) => a + (l.side === "buy" ? 1 : -1) * l.ratio * (l.kind === "call" ? Math.max(0, S - l.strike) : Math.max(0, l.strike - S)), 0);
  return (v - p.entry_price) * 100 * p.qty;
}

function payoffRange(p, price) {
  const ks = p.legs.map((l) => l.strike).concat(price ? [price] : []);
  const lo = Math.min(...ks), hi = Math.max(...ks), pad = Math.max((hi - lo) * 0.6, hi * 0.06);
  return [Math.max(0, lo - pad), hi + pad];
}

function breakevens(p, [a, z]) {
  const out = [], n = 400;
  let prev = payoffAt(p, a);
  for (let i = 1; i <= n; i++) {
    const S = a + (z - a) * i / n, v = payoffAt(p, S);
    if ((prev < 0) !== (v < 0)) out.push(S - (z - a) / n * (v / (v - prev)));
    prev = v;
  }
  return out;
}

function positionCard(p, b, price, i) {
  const range = payoffRange(p, price);
  const n = 200, vals = Array.from({ length: n + 1 }, (_, k) => payoffAt(p, range[0] + (range[1] - range[0]) * k / n));
  const maxProfit = Math.max(...vals);
  const maxLoss = p.kind === "covered_call" ? null : -p.max_loss * p.qty;
  const be = breakevens(p, range);
  const base = Math.abs(p.entry_price) || 1, change = p.mark == null ? 0 : (p.mark - p.entry_price) / base;
  const lo = -(b.rules.stop_loss || 1), hi = b.rules.take_profit, posPct = (v) => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const exp = p.legs[0]?.expiration, dte = exp ? Math.max(0, Math.round((Date.parse(exp) - Date.now()) / 864e5)) : null;
  return `<article class="panel ${seenPos.has(p.id) ? "" : "enter"}" style="--i:${i}">
    <div class="posn-top"><span><b>#${p.id}</b> ${esc(p.kind.replace("_", " "))} · ${esc(p.direction)} ×${p.qty}</span><span class="mono ${cls(p.mark_pnl)}" style="font-size:16px;font-weight:700">${usd(p.mark_pnl, true)}</span></div>
    <div class="sub mono" style="margin-top:2px">${esc(legsText(p))} · exp ${esc(exp ?? "")}${dte != null ? ` (${dte} DTE)` : ""}</div>
    <div class="payoff" id="payoff-${p.id}" role="img" aria-label="Profit and loss at expiration across ${esc(b.underlying)} prices"></div>
    <div class="range" style="--z:${posPct(0)}%;--p:${posPct(change)}%;--c:${botColor(b.name)}"><span class="zero"></span><span class="mark"></span></div>
    <div class="range-lbl mono"><span>stop ${Math.round(lo * 100)}%</span><span>now ${change >= 0 ? "+" : ""}${Math.round(change * 100)}%</span><span>target +${Math.round(hi * 100)}%</span></div>
    <div class="facts">
      <div class="stat"><div class="k">Entry</div><div class="v num">${p.entry_price < 0 ? "cr" : "db"} ${base.toFixed(2)}</div></div>
      <div class="stat"><div class="k">Max profit</div><div class="v num pos">${usd(maxProfit, true)}</div></div>
      <div class="stat"><div class="k">Max loss</div><div class="v num neg">${maxLoss == null ? "covered" : usd(maxLoss, true)}</div></div>
      <div class="stat"><div class="k">Breakeven</div><div class="v num">${be.length ? be.map((x) => x.toFixed(2)).join(" / ") : "—"}</div></div>
    </div>
    ${p.meta?.reason ? `<div class="sub" style="margin-top:8px;font-size:12px">${esc(p.meta.reason)}</div>` : ""}
  </article>`;
}

/** Payoff-at-expiration diagram: green above zero, red below, current price and strikes marked. */
function drawPayoff(el, p, b, price, animate) {
  if (!el) return;
  const W = el.clientWidth, H = el.clientHeight, m = { l: 54, r: 10, t: 10, b: 22 };
  const [a, z] = payoffRange(p, price);
  const n = 240, pts = Array.from({ length: n + 1 }, (_, k) => { const S = a + (z - a) * k / n; return [S, payoffAt(p, S)]; });
  let y0 = Math.min(0, ...pts.map((q) => q[1])), y1 = Math.max(0, ...pts.map((q) => q[1]));
  const pad = (y1 - y0) * 0.12 || 1; y0 -= pad; y1 += pad;
  const X = (s) => m.l + (s - a) / (z - a) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const d = pts.map((q, k) => `${k ? "L" : "M"}${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join("");
  const zeroY = Y(0), uid = "pf" + p.id;
  const strikes = [...new Set(p.legs.map((l) => l.strike))];
  const ticks = [y0 + pad, 0, y1 - pad].filter((v, i, arr) => arr.indexOf(v) === i);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
    <defs>
      <clipPath id="${uid}-up"><rect x="0" y="0" width="${W}" height="${zeroY}"/></clipPath>
      <clipPath id="${uid}-dn"><rect x="0" y="${zeroY}" width="${W}" height="${H - zeroY}"/></clipPath>
    </defs>
    ${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">${usd(v, v !== 0)}</text>`).join("")}
    <path d="${d}L${X(z)},${zeroY}L${X(a)},${zeroY}Z" fill="var(--good)" opacity=".16" clip-path="url(#${uid}-up)" class="${animate && !reduced ? "fade-in" : ""}"/>
    <path d="${d}L${X(z)},${zeroY}L${X(a)},${zeroY}Z" fill="var(--bad)" opacity=".16" clip-path="url(#${uid}-dn)" class="${animate && !reduced ? "fade-in" : ""}"/>
    <line x1="${m.l}" x2="${W - m.r}" y1="${zeroY}" y2="${zeroY}" stroke="var(--text-muted)" stroke-width="1"/>
    ${strikes.map((k) => `<line x1="${X(k)}" x2="${X(k)}" y1="${H - m.b}" y2="${H - m.b + 5}" stroke="var(--text-muted)"/><text x="${X(k)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">${k}</text>`).join("")}
    <path d="${d}" fill="none" stroke="${botColor(b.name)}" stroke-width="2" stroke-linejoin="round" id="${uid}-line"/>
    ${price ? `<line x1="${X(price)}" x2="${X(price)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-primary)" stroke-dasharray="3 3" opacity=".7"/>
      <circle cx="${X(price)}" cy="${Y(payoffAt(p, price))}" r="5" fill="${botColor(b.name)}" stroke="var(--surface-solid)" stroke-width="2"/>
      <text x="${Math.min(X(price) + 6, W - 70)}" y="${m.t + 10}" font-size="11" font-weight="600" fill="var(--text-secondary)">now ${price.toFixed(2)}</text>` : ""}
  </svg>`;
  const line = document.getElementById(uid + "-line");
  if (animate && !reduced && line.getTotalLength) { line.style.setProperty("--len", line.getTotalLength()); line.classList.add("draw"); }
}

function renderHistory(b) {
  const rows = b.history.filter((p) => filter === "all" || (filter === "win" ? p.pnl > 0 : p.pnl != null && p.pnl <= 0));
  const hold = (p) => p.opened_at && p.closed_at ? days((Date.parse(p.closed_at) - Date.parse(p.opened_at)) / 864e5) : "—";
  setHTML(F("history"), rows.length ? `<table class="hist"><thead><tr><th>#</th><th>Closed</th><th>Type</th><th>Legs</th><th class="r">Qty</th><th class="r">Entry</th><th class="r">Exit</th><th class="r">P&amp;L</th><th>Reason</th><th class="r">Held</th></tr></thead><tbody>
    ${rows.map((p, i) => `<tr style="--i:${i}"><td class="muted">${p.id}</td><td>${esc(fmtTime(p.closed_at))}</td><td>${esc(p.kind.replace("_", " "))}</td>
      <td class="mono">${esc(legsText(p))}</td><td class="r mono">${p.qty}</td><td class="r mono">${p.entry_price.toFixed(2)}</td>
      <td class="r mono">${p.exit_price == null ? "—" : p.exit_price.toFixed(2)}</td><td class="r mono ${cls(p.pnl)}">${usd(p.pnl, true)}</td>
      <td>${esc(p.exit_reason)}</td><td class="r mono">${hold(p)}</td></tr>`).join("")}</tbody></table>` :
    `<div class="none">${filter === "all" ? "No closed trades yet." : "No trades match this filter."}</div>`);
}

async function refresh() {
  try {
    const r = await fetch("api/bot/" + encodeURIComponent(BOT), { cache: "no-store" });
    if (r.status === 404) { $("#main").innerHTML = `<div class="panel not-found"><h2>No bot called “${esc(BOT)}”</h2><p class="sub"><a href="./">Back to all bots</a></p></div>`; return; }
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    const upd = $("#updated"); upd._h = null; upd.className = "pill st-offline";
    upd.innerHTML = `<span class="live-dot"></span><span>Can't reach the server (${esc(e.message)}) · retrying</span>`;
  }
}
refresh();
setInterval(refresh, 15000);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (last) { F("positions")._h = null; render(last); } }, 150); });
</script>
</body>
</html>
