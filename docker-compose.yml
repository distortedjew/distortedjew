services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisp
      POSTGRES_PASSWORD: wisp
      POSTGRES_DB: wisp
    ports:
      # Local development only: bound to this machine so the database (with
      # its well-known dev password) is never reachable from the network.
      # For a real server, use docker-compose.prod.yml.
      - "127.0.0.1:5432:5432"
    volumes:
      - wisp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Bound to this machine only: this Redis has no password.
      - "127.0.0.1:6379:6379"
    volumes:
      - wisp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wisp_pg_data:
  wisp_redis_data:
