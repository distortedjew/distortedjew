name: youtube-video

on:
  schedule:
    - cron: "0 14 * * *"   # ogni giorno 14:00 UTC; il video esce publish_delay_hours dopo (vedi yt-pipeline/channel.json)
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Genera solo il video, senza caricarlo"
        type: boolean
        default: false

permissions:
  contents: write   # per salvare state/history.json (evita idee ripetute)

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: yt-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: yt-pipeline/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Genera e carica
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m ytp.run ${{ inputs.no_upload && '--no-upload' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: video, path: yt-pipeline/output/, retention-days: 3 }
      - name: Salva storico
        run: |
          git config user.name "yt-bot"; git config user.email "yt-bot@users.noreply.github.com"
          git add state/history.json && (git commit -m "yt: storico video" && git pull --rebase && git push) || true
