name: Wiki · deploy

on:
  push:
    branches: [main]
    paths: ['gta-wiki/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Identificativi PUBBLICI da Settings > Secrets and variables > Actions > Variables (mai segreti). Vedi gta-wiki/docs/MONETIZATION.md
    env:
      WIKI_LEGAL_OWNER: ${{ vars.WIKI_LEGAL_OWNER }}
      WIKI_LEGAL_EMAIL: ${{ vars.WIKI_LEGAL_EMAIL }}
      WIKI_ANALYTICS_PROVIDER: ${{ vars.WIKI_ANALYTICS_PROVIDER }}
      WIKI_PLAUSIBLE_DOMAIN: ${{ vars.WIKI_PLAUSIBLE_DOMAIN }}
      WIKI_GA4_ID: ${{ vars.WIKI_GA4_ID }}
      WIKI_ADS_PROVIDER: ${{ vars.WIKI_ADS_PROVIDER }}
      WIKI_ADSENSE_CLIENT: ${{ vars.WIKI_ADSENSE_CLIENT }}
      WIKI_ADSENSE_SLOT_ARTICLE: ${{ vars.WIKI_ADSENSE_SLOT_ARTICLE }}
      WIKI_ADSENSE_SLOT_HOME: ${{ vars.WIKI_ADSENSE_SLOT_HOME }}
      WIKI_ADS_CMP: ${{ vars.WIKI_ADS_CMP }}
      WIKI_ADS_ALLOW_OFFICIAL_IMAGES: ${{ vars.WIKI_ADS_ALLOW_OFFICIAL_IMAGES }}
      WIKI_ADS_ROCKSTAR_PERMISSION_REF: ${{ vars.WIKI_ADS_ROCKSTAR_PERMISSION_REF }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: gta-wiki
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Valida i contenuti
        run: npm run validate
      - name: Costruisci il sito
        env:
          WIKI_BASE: ${{ steps.pages.outputs.base_path }}
          WIKI_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build
      - name: Audit SEO, sicurezza e link
        run: node scripts/audit.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gta-wiki/dist
      - id: deployment
        uses: actions/deploy-pages@v4
