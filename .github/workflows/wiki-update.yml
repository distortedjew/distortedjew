name: Wiki · aggiornamento automatico

on:
  schedule:
    - cron: '17 * * * *'      # ogni ora; nella settimana di lancio puoi scendere a */15
  workflow_dispatch:
    inputs:
      focus:
        description: 'Argomento su cui concentrarsi (facoltativo, es. "easter egg" o "mappa")'
        required: false

# Permessi minimi: il job scrive solo sul repository. Nessun id-token.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Agente editoriale (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Leggi gta-wiki/AGENT.md e segui alla lettera le istruzioni, comprese le regole di sicurezza.
            Data odierna (UTC): ${{ steps.today.outputs.date }}
            Argomento richiesto: ${{ github.event.inputs.focus || 'nessuno: cerca tutte le novità recenti' }}
            Modifica solo i file gta-wiki/content/*.json. Alla fine esegui: cd gta-wiki && npm run check
          # Allowlist stretta: ricerca web in lettura, modifica file, e solo i comandi di verifica.
          claude_args: >-
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit,Write,Bash(npm run check:*),Bash(npm run validate:*),Bash(git diff:*),Bash(git status:*)"

      - name: Guardia, validazione e commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.WIKI_MODE || 'direct' }}
        run: |
          set -euo pipefail
          CHANGED="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          if [ -z "$CHANGED" ]; then
            echo "Nessuna novità."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Guardia 1: l'agente può toccare solo i file JSON dei contenuti.
          BAD="$(printf '%s\n' "$CHANGED" | grep -vE '^gta-wiki/content/[a-z-]+\.json$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Modifiche fuori perimetro:"; printf '%s\n' "$BAD"; exit 1
          fi
          # Guardia 2: validazione, build e audit (SEO, CSP, link) devono passare.
          (cd gta-wiki && npm run check && WIKI_SITE_URL=https://example.invalid node scripts/build.mjs >/dev/null && node scripts/audit.mjs)
          git config user.name  "leonida-files-bot"
          git config user.email "leonida-files-bot@users.noreply.github.com"
          git add gta-wiki/content
          git commit -m "wiki: aggiornamento automatico $(date -u '+%Y-%m-%d %H:%M') UTC"
          if [ "$MODE" = "pr" ]; then
            BR="wiki-auto/$(date -u +%Y%m%d-%H%M)"
            git push origin "HEAD:refs/heads/$BR"
            gh pr create --base main --head "$BR" --title "Wiki: aggiornamento automatico" --body "Aggiornamento generato dall'agente editoriale. Validazione e audit superati."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/wiki-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
