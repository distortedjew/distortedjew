<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Wisp</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fcfbff;
        color: #252433;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #a78bfa, #fbcfe8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #777486;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        border: none;
        background: #a78bfa;
        color: #252433;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #151420;
          color: #f2f1f7;
        }
        p {
          color: #a3a0b3;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">✨</div>
      <h1>You're offline</h1>
      <p>
        Wisp needs a connection to match you with someone. Check your network
        and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
