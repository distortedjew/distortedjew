<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Wisp</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f3f9;
        color: #1d1838;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 30%;
        background: #6b4eff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #5f5a78;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        border: none;
        background: #6b4eff;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141126;
          color: #eeeafb;
        }
        p {
          color: #a9a3c4;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg viewBox="0 0 64 64" width="30" height="30" fill="none" aria-hidden="true">
          <path d="M17 47 C 15 33, 22 19, 36 16 C 46 14, 53 20, 52 27 C 51 33, 44 35, 41 30 C 39 27, 41 23, 45 24" stroke="white" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="17" cy="47" r="4.4" fill="#2bd4a0"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Wisp needs an internet connection to match you with someone. Check your
        Wi‑Fi or mobile data, then try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
