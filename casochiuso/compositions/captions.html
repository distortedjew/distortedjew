<template>
<style>
  #root{position:absolute;inset:0;}
  .cap{position:absolute;left:160px;right:160px;bottom:62px;text-align:center;font-family:Montserrat;font-weight:800;font-size:40px;line-height:1.22;color:#F4EBD9;}
  .cap span{-webkit-text-stroke:9px #2A1215;paint-order:stroke fill;}

<div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
<div id="cap-c0-0-0" class="clip cap" data-start="0.250" data-duration="5.932" data-track-index="1"><span>Primo dicembre millenovecentoquarantotto. Una spiaggia di Adelaide, in Australia.</span></div>
<div id="cap-c0-1-0" class="clip cap" data-start="6.582" data-duration="5.655" data-track-index="1"><span>Un uomo elegante è seduto contro il muro del lungomare. Sembra addormentato.</span></div>
<div id="cap-c0-2-0" class="clip cap" data-start="12.637" data-duration="5.654" data-track-index="1"><span>Non lo è. E per i settantaquattro anni successivi, nessuno saprà dire chi fosse.</span></div>
<div id="cap-c0-3-0" class="clip cap" data-start="18.691" data-duration="4.563" data-track-index="1"><span>Questa è la storia di un uomo senza nome, di un biglietto strappato,</span></div>
<div id="cap-c0-3-1" class="clip cap" data-start="23.254" data-duration="2.818" data-track-index="1"><span>di un codice che nessuno ha mai decifrato…</span></div>
<div id="cap-c0-3-2" class="clip cap" data-start="26.073" data-duration="4.460" data-track-index="1"><span>e di un capello rimasto nascosto dentro una maschera di gesso.</span></div>
<div id="cap-c1-0-0" class="clip cap" data-start="37.933" data-duration="4.171" data-track-index="1"><span>La sera prima, una coppia passeggia sulla sabbia di Somerton.</span></div>
<div id="cap-c1-0-1" class="clip cap" data-start="42.104" data-duration="5.771" data-track-index="1"><span>Vede un uomo disteso vicino al muro. Lo vede muovere un braccio, poi più niente.</span></div>
<div id="cap-c1-1-0" class="clip cap" data-start="48.275" data-duration="3.479" data-track-index="1"><span>Pensano che abbia bevuto troppo, e proseguono.</span></div>
<div id="cap-c1-2-0" class="clip cap" data-start="52.154" data-duration="4.716" data-track-index="1"><span>La mattina dopo, un fantino che passa di lì lo trova senza vita.</span></div>
<div id="cap-c1-3-0" class="clip cap" data-start="57.270" data-duration="6.016" data-track-index="1"><span>Indossa giacca, cravatta, scarpe lucidate a specchio. Ha circa quarant'anni, è in forma,</span></div>
<div id="cap-c1-3-1" class="clip cap" data-start="63.286" data-duration="3.991" data-track-index="1"><span>e non porta il cappello, cosa stranissima per l'epoca.</span></div>
<div id="cap-c1-4-0" class="clip cap" data-start="67.677" data-duration="5.252" data-track-index="1"><span>Non ha il portafoglio. Non ha documenti. E c'è un dettaglio che gela la polizia:</span></div>
<div id="cap-c1-4-1" class="clip cap" data-start="72.929" data-duration="4.370" data-track-index="1"><span>qualcuno ha tagliato via le etichette da tutti i suoi vestiti.</span></div>
<div id="cap-c2-0-0" class="clip cap" data-start="81.299" data-duration="6.577" data-track-index="1"><span>Gli investigatori confrontano le impronte digitali, le fotografie, i registri dei dentisti.</span></div>
<div id="cap-c2-0-1" class="clip cap" data-start="87.876" data-duration="0.806" data-track-index="1"><span>Niente.</span></div>
<div id="cap-c2-1-0" class="clip cap" data-start="89.082" data-duration="5.953" data-track-index="1"><span>In tutta l'Australia, nessuno sembra aver denunciato la scomparsa di un uomo come lui.</span></div>
<div id="cap-c2-2-0" class="clip cap" data-start="95.435" data-duration="5.562" data-track-index="1"><span>Il patologo esamina il corpo. Gli organi sono congestionati, e sospetta un veleno,</span></div>
<div id="cap-c2-2-1" class="clip cap" data-start="100.997" data-duration="1.928" data-track-index="1"><span>ma non ne trova traccia.</span></div>
<div id="cap-c2-3-0" class="clip cap" data-start="103.325" data-duration="5.718" data-track-index="1"><span>Nota anche i polpacci: sviluppati come quelli di un ballerino, o di un corridore.</span></div>
<div id="cap-c2-4-0" class="clip cap" data-start="109.443" data-duration="1.986" data-track-index="1"><span>Chi era, quest'uomo?</span></div>
<div id="cap-c3-0-0" class="clip cap" data-start="115.429" data-duration="6.501" data-track-index="1"><span>Un indizio arriva dalla stazione ferroviaria di Adelaide. Nel deposito bagagli c'è una valigia,</span></div>
<div id="cap-c3-0-1" class="clip cap" data-start="121.930" data-duration="2.695" data-track-index="1"><span>lasciata lì poco prima della morte.</span></div>
<div id="cap-c3-1-0" class="clip cap" data-start="125.025" data-duration="3.891" data-track-index="1"><span>Dentro: vestiti, un pennello da stencil, delle forbici,</span></div>
<div id="cap-c3-1-1" class="clip cap" data-start="128.916" data-duration="3.555" data-track-index="1"><span>e un filo arancione di un tipo piuttosto raro.</span></div>
<div id="cap-c3-2-0" class="clip cap" data-start="132.871" data-duration="5.420" data-track-index="1"><span>Anche qui le etichette sono state strappate. Resta soltanto un nome: Keane.</span></div>
<div id="cap-c3-3-0" class="clip cap" data-start="138.691" data-duration="5.442" data-track-index="1"><span>Ma nessun Keane risulta scomparso. Era il suo vero nome? O un depistaggio?</span></div>
<div id="cap-c4-0-0" class="clip cap" data-start="148.133" data-duration="5.124" data-track-index="1"><span>Gennaio millenovecentoquarantanove. Un patologo guarda meglio i vestiti,</span></div>
<div id="cap-c4-0-1" class="clip cap" data-start="153.257" data-duration="4.712" data-track-index="1"><span>e in una tasca nascosta trova un pezzetto di carta arrotolato.</span></div>
<div id="cap-c4-1-0" class="clip cap" data-start="158.369" data-duration="4.481" data-track-index="1"><span>Due parole, in persiano: Tamam Shud. Significano: è finito.</span></div>
<div id="cap-c4-2-0" class="clip cap" data-start="163.250" data-duration="6.337" data-track-index="1"><span>Sono state strappate dall'ultima pagina di un libro di poesie, il Rubaiyat di Omar Khayyam.</span></div>
<div id="cap-c4-3-0" class="clip cap" data-start="169.987" data-duration="6.254" data-track-index="1"><span>La polizia lancia un appello. E un uomo si presenta: pochi giorni prima del ritrovamento,</span></div>
<div id="cap-c4-3-1" class="clip cap" data-start="176.241" data-duration="5.289" data-track-index="1"><span>aveva trovato una copia del libro sul sedile posteriore della sua auto.</span></div>
<div id="cap-c4-4-0" class="clip cap" data-start="181.930" data-duration="5.548" data-track-index="1"><span>L'ultima pagina era stata strappata. Il pezzetto combacia perfettamente.</span></div>
<div id="cap-c5-0-0" class="clip cap" data-start="191.478" data-duration="4.133" data-track-index="1"><span>Sul retro del libro, scritte a matita in lettere maiuscole,</span></div>
<div id="cap-c5-0-1" class="clip cap" data-start="195.611" data-duration="5.063" data-track-index="1"><span>ci sono cinque righe di lettere senza senso. Una è stata cancellata.</span></div>
<div id="cap-c5-1-0" class="clip cap" data-start="201.074" data-duration="6.444" data-track-index="1"><span>C'è anche un numero di telefono. Porta a un'infermiera che abitava vicinissima alla spiaggia.</span></div>
<div id="cap-c5-2-0" class="clip cap" data-start="207.918" data-duration="4.633" data-track-index="1"><span>Lei dice di non conoscere l'uomo. Ma, secondo alcune testimonianze,</span></div>
<div id="cap-c5-2-1" class="clip cap" data-start="212.551" data-duration="3.411" data-track-index="1"><span>davanti al suo volto di gesso sembrò turbata.</span></div>
<div id="cap-c5-3-0" class="clip cap" data-start="216.362" data-duration="6.459" data-track-index="1"><span>Le lettere restano un enigma. Crittografi, militari e appassionati ci provano per decenni.</span></div>
<div id="cap-c5-3-1" class="clip cap" data-start="222.821" data-duration="2.310" data-track-index="1"><span>Nessuno riesce a decifrarle.</span></div>
<div id="cap-c6-0-0" class="clip cap" data-start="229.131" data-duration="2.626" data-track-index="1"><span>Il caso diventa leggenda.</span></div>
<div id="cap-c6-1-0" class="clip cap" data-start="232.157" data-duration="5.413" data-track-index="1"><span>Una spia della Guerra Fredda, perché a poche centinaia di chilometri c'è Woomera,</span></div>
<div id="cap-c6-1-1" class="clip cap" data-start="237.570" data-duration="2.439" data-track-index="1"><span>il grande poligono missilistico.</span></div>
<div id="cap-c6-2-0" class="clip cap" data-start="240.409" data-duration="2.284" data-track-index="1"><span>Un amore finito male.</span></div>
<div id="cap-c6-3-0" class="clip cap" data-start="243.093" data-duration="2.881" data-track-index="1"><span>Un veleno impossibile da trovare.</span></div>
<div id="cap-c6-4-0" class="clip cap" data-start="246.374" data-duration="5.319" data-track-index="1"><span>Ogni ipotesi ha un pezzo che non torna. Il corpo viene sepolto. Ma prima,</span></div>
<div id="cap-c6-4-1" class="clip cap" data-start="251.693" data-duration="3.789" data-track-index="1"><span>il suo volto viene copiato in una maschera di gesso.</span></div>
<div id="cap-c6-4-2" class="clip cap" data-start="255.481" data-duration="4.526" data-track-index="1"><span>E nessuno sa che quella maschera conserva ancora qualcosa.</span></div>
<div id="cap-c7-0-0" class="clip cap" data-start="264.007" data-duration="3.811" data-track-index="1"><span>Passano più di settant'anni. All'Università di Adelaide,</span></div>
<div id="cap-c7-0-1" class="clip cap" data-start="267.818" data-duration="4.724" data-track-index="1"><span>il professor Derek Abbott non ha mai smesso di inseguire il caso.</span></div>
<div id="cap-c7-1-0" class="clip cap" data-start="272.942" data-duration="7.041" data-track-index="1"><span>Insieme alla genealogista americana Colleen Fitzpatrick prova una strada nuova: il DNA.</span></div>
<div id="cap-c7-2-0" class="clip cap" data-start="280.383" data-duration="5.890" data-track-index="1"><span>Ma del corpo non si può più ricavare nulla di utile. Resta la maschera di gesso.</span></div>
<div id="cap-c7-3-0" class="clip cap" data-start="286.673" data-duration="5.526" data-track-index="1"><span>Dentro, intrappolato nel gesso, c'è un capello. Uno solo, con la sua radice.</span></div>
<div id="cap-c7-4-0" class="clip cap" data-start="292.599" data-duration="6.413" data-track-index="1"><span>Da quel capello ricavano un profilo genetico. Lo confrontano con i database di genealogia,</span></div>
<div id="cap-c7-4-1" class="clip cap" data-start="299.012" data-duration="1.211" data-track-index="1"><span>e ramo dopo ramo,</span></div>
<div id="cap-c7-4-2" class="clip cap" data-start="300.223" data-duration="7.354" data-track-index="1"><span>costruiscono un albero di famiglia partendo da cugini lontani che non sapevano nemmeno di esistere.</span></div>
<div id="cap-c8-0-0" class="clip cap" data-start="311.577" data-duration="3.457" data-track-index="1"><span>Luglio duemilaventidue. Arriva la risposta.</span></div>
<div id="cap-c8-1-0" class="clip cap" data-start="315.434" data-duration="4.012" data-track-index="1"><span>L'uomo della spiaggia si chiamava Carl Webb, detto Charles.</span></div>
<div id="cap-c8-1-1" class="clip cap" data-start="319.446" data-duration="6.421" data-track-index="1"><span>Ingegnere elettrico e costruttore di strumenti, nato a Melbourne nel millenovecentocinque.</span></div>
<div id="cap-c8-2-0" class="clip cap" data-start="326.267" data-duration="6.220" data-track-index="1"><span>Aveva quarantatré anni. L'ultima traccia di lui è dell'aprile del millenovecentoquarantasette,</span></div>
<div id="cap-c8-2-1" class="clip cap" data-start="332.487" data-duration="1.888" data-track-index="1"><span>quando lasciò la moglie.</span></div>
<div id="cap-c8-3-0" class="clip cap" data-start="334.775" data-duration="6.526" data-track-index="1"><span>Poi, più niente. Per settantaquattro anni, un uomo con una famiglia, una casa, una vita intera,</span></div>
<div id="cap-c8-3-1" class="clip cap" data-start="341.301" data-duration="3.460" data-track-index="1"><span>è rimasto un punto interrogativo sulla sabbia.</span></div>
<div id="cap-c9-0-0" class="clip cap" data-start="348.761" data-duration="2.263" data-track-index="1"><span>Il caso è chiuso? Non del tutto.</span></div>
<div id="cap-c9-0-1" class="clip cap" data-start="351.024" data-duration="7.018" data-track-index="1"><span>La polizia dell'Australia Meridionale non ha ancora verificato ufficialmente l'identificazione.</span></div>
<div id="cap-c9-1-0" class="clip cap" data-start="358.442" data-duration="6.381" data-track-index="1"><span>E le domande più grandi restano senza risposta. Di cosa è morto? Cosa dicono quelle lettere?</span></div>
<div id="cap-c9-1-1" class="clip cap" data-start="364.823" data-duration="6.612" data-track-index="1"><span>Perché tagliare le etichette? E cosa ci faceva Carl Webb, quella notte, su quella spiaggia?</span></div>
<div id="cap-c9-2-0" class="clip cap" data-start="371.835" data-duration="5.329" data-track-index="1"><span>Forse è questo il vero significato di Tamam Shud. Non soltanto: è finito. Ma:</span></div>
<div id="cap-c9-2-1" class="clip cap" data-start="377.164" data-duration="3.761" data-track-index="1"><span>ora che sappiamo chi era, qualcosa può cominciare.</span></div>
<div id="cap-c9-3-0" class="clip cap" data-start="381.325" data-duration="3.841" data-track-index="1"><span>Questo era Caso Chiuso. Un mistero vero alla volta.</span></div>
</div>
