<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalp City</title>
<style>
  :root { --bg:#0b0f6b; --ink:#e8f0ff; --dim:#8fa3ff; --green:#33ff99; --red:#ff4d6d; --gold:#ffd84d; --panel:rgba(6,10,50,.92); --line:#3c56ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  .lbl { pointer-events:auto; cursor:pointer; background:rgba(4,8,40,.85); border:1.5px solid var(--green); border-radius:6px; padding:3px 8px; text-align:center; white-space:nowrap; font-weight:700; text-shadow:0 0 6px rgba(80,255,170,.35); }
  .lbl .n { color:var(--gold); } .lbl .s { color:var(--dim); font-weight:400; font-size:11px; } .lbl .p { font-size:12px; }
  .lbl.put { border-color:var(--red); } .lbl.idle { border-color:#5a6bd8; }
  .sign { font:900 20px/1 system-ui,sans-serif; letter-spacing:1px; padding:6px 14px; border:2px solid var(--green); background:rgba(10,20,90,.8); color:#e6ecff; border-radius:4px; }
  .sign.red { border-color:var(--red); }
  .title { font:900 44px/1 system-ui,sans-serif; padding:8px 26px; border:3px solid #6ff; color:#cfe6ff; background:rgba(20,30,120,.7); text-shadow:0 0 18px #6ff; }
  .vault { pointer-events:auto; cursor:pointer; background:rgba(0,0,0,.85); border:2px solid var(--gold); border-radius:6px; padding:6px 14px; text-align:center; }
  .vault .h { color:var(--gold); font-size:11px; letter-spacing:2px; font-weight:700; } .vault .v { font-size:24px; font-weight:800; } .vault .f { color:var(--dim); font-size:10px; }
  #hud { position:fixed; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; gap:12px; pointer-events:none; }
  #hud .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; pointer-events:auto; }
  #ribbon { position:fixed; left:0; right:0; bottom:34px; display:flex; gap:6px; padding:6px 12px; overflow-x:auto; scrollbar-width:thin; }
  .chip { flex:0 0 auto; min-width:84px; cursor:pointer; background:var(--panel); border:1.5px solid var(--line); border-radius:6px; padding:4px 8px; }
  .chip .d { color:var(--dim); font-size:10px; } .chip .v { font-weight:800; }
  .chip.sel { border-color:var(--gold); box-shadow:0 0 10px rgba(255,216,77,.5); }
  #tape { position:fixed; left:0; right:0; bottom:0; height:30px; background:rgba(2,4,30,.95); border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; padding:7px 12px; color:var(--dim); }
  #panel { position:fixed; top:58px; right:12px; width:min(560px,calc(100vw - 24px)); max-height:calc(100vh - 150px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:none; }
  #panel h2 { margin:0 0 4px; font-size:16px; color:var(--gold); } #panel .x { float:right; cursor:pointer; color:var(--dim); font-size:18px; }
  #panel canvas { width:100%; height:260px; display:block; background:#060a3a; border-radius:6px; margin:8px 0; }
  table { width:100%; border-collapse:collapse; font-size:12px; } td,th { padding:3px 4px; text-align:right; border-bottom:1px solid rgba(80,100,255,.2); } td:first-child,th:first-child { text-align:left; }
  .g { color:var(--green); } .r { color:var(--red); } .muted { color:var(--dim); }
  .legend span { margin-right:12px; font-size:11px; }
  @media (max-width:600px) {
    .title { font-size:26px; } .sign { font-size:12px; padding:4px 8px; } #panel canvas { height:200px; }
    .lbl { font-size:10px; padding:2px 5px; } .lbl .s, .lbl .p { font-size:9px; }
    .vault { padding:4px 10px; } .vault .v { font-size:18px; } #hint { display:none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div class="box" id="status">connecting…</div>
  <div class="box muted" id="hint">drag to orbit · scroll to zoom · click a tower</div>
</div>
<div id="panel"><span class="x" id="close">×</span><div id="pbody"></div></div>
<div id="ribbon"></div>
<div id="tape"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const $ = (s) => document.querySelector(s);
const money = (v) => (v >= 0 ? "+" : "−") + "$" + Math.abs(Math.round(v)).toLocaleString();
const cls = (v) => (v > 0 ? "g" : v < 0 ? "r" : "");

// ---------------------------------------------------------------- scene
const host = $("#scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = "position:absolute;top:0;left:0;pointer-events:none";
host.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f6b);
scene.fog = new THREE.Fog(0x0b0f6b, 60, 150);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
camera.position.set(0, 34, 52);
const controls = new OrbitControls(camera, labels.domElement);
labels.domElement.style.pointerEvents = "auto";
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 15; controls.maxDistance = 110;

scene.add(new THREE.AmbientLight(0x8899ff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(20, 40, 20); scene.add(sun);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  // portrait phones see a narrow slice of the ring: back the camera off so every tower fits
  const k = Math.max(1, 1.25 / camera.aspect);
  camera.position.set(0, 34 * Math.min(k, 1.9), 52 * Math.min(k, 2.1));
}
addEventListener("resize", resize); resize();

// ground + grid + ring road
const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 64), new THREE.MeshLambertMaterial({ color: 0x1a22b8 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const grid = new THREE.GridHelper(220, 88, 0x3d4dff, 0x2a36d0); grid.position.y = 0.02; scene.add(grid);
const glow = (c, o = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o });
for (const [r, c] of [[24, 0x9fd8ff], [25.2, 0x5577ff]]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.18, 8, 128), glow(c, 0.9));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.3; scene.add(ring);
}
// road dashes
for (let i = 0; i < 90; i++) {
  const a = (i / 90) * Math.PI * 2, d = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.15), glow(0xffffff, 0.8));
  d.position.set(Math.cos(a) * 24.6, 0.32, Math.sin(a) * 24.6); d.rotation.y = -a; scene.add(d);
}

// window texture
function windowsTexture(lit = 0.55) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 128;
  const g = c.getContext("2d"); g.fillStyle = "#0a0f3c"; g.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 128; y += 8) for (let x = 4; x < 64; x += 8) {
    g.fillStyle = Math.random() < lit ? (Math.random() < 0.15 ? "#9ff" : "#fff") : "#1b2470";
    g.fillRect(x, y, 4, 5);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const winTex = [windowsTexture(0.6), windowsTexture(0.4), windowsTexture(0.75)];
function building(w, h, d, tex = winTex[(Math.random() * 3) | 0]) {
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, w / 2), Math.max(1, h / 4));
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ map: t, emissive: 0x111155, emissiveMap: t, emissiveIntensity: 0.9 }));
}

// filler skyline outside the ring, and a small suburb in front
const rand = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < 160; i++) {
  const a = rand(0, Math.PI * 2), r = rand(34, 95);
  if (Math.sin(a) > 0.55 && r < 60) continue; // keep the camera's foreground open
  const h = rand(3, 22) * (r > 60 ? 1.4 : 1);
  const b = building(rand(2, 5), h, rand(2, 5)); b.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); scene.add(b);
}
for (let i = 0; i < 40; i++) {
  const b = building(rand(1, 2.4), rand(0.8, 2.5), rand(1, 2.4)); b.position.set(rand(-28, 28), 0.8, rand(30, 48)); scene.add(b);
}

function label(html, cn) { const el = document.createElement("div"); el.className = cn; el.innerHTML = html; return [new CSS2DObject(el), el]; }
const [titleObj] = label("Scalp City", "title"); titleObj.position.set(0, 21, -75); scene.add(titleObj);

// vault
const vault = new THREE.Group();
const vbase = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.6, 3, 32), new THREE.MeshLambertMaterial({ color: 0xffe6e6, emissive: 0x552222 }));
vbase.position.y = 1.5; vault.add(vbase);
const dome = new THREE.Mesh(new THREE.SphereGeometry(4.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
dome.position.y = 3; vault.add(dome);
const pad = new THREE.Mesh(new THREE.CircleGeometry(7.5, 48), new THREE.MeshBasicMaterial({ color: 0x0a0a40 }));
pad.rotation.x = -Math.PI / 2; pad.position.y = 0.05; vault.add(pad);
vault.position.set(0, 0, 8); scene.add(vault);
const [vaultObj, vaultEl] = label("", "vault"); vaultObj.position.set(0, 10, 8); scene.add(vaultObj);
vaultEl.onclick = () => openPayroll();

// ---------------------------------------------------------------- towers
let state = null, selDay = null, selWorker = null;
const towers = new Map(); // name -> {group, beam, label, el, links}
const districts = new Map();

function makeTower(w, i, n) {
  const a = Math.PI * (1.08 + (0.84 * i) / Math.max(n - 1, 1)); // spread across the back half of the ring
  const r = 17, x = Math.cos(a) * r, z = Math.sin(a) * r;
  const g = new THREE.Group(); g.position.set(x, 0, z); g.userData.name = w.name;
  const podium = new THREE.Mesh(new THREE.BoxGeometry(9, 0.6, 9), new THREE.MeshLambertMaterial({ color: 0x0d1450, emissive: 0x050a30 }));
  podium.position.y = 0.3; g.add(podium);
  for (let k = 0; k < 5; k++) { // annex buildings
    const h = rand(2, 6), b = building(rand(1.5, 2.5), h, rand(1.5, 2.5));
    b.position.set(rand(-3.5, 3.5), h / 2 + 0.6, rand(-3.5, 3.5)); if (Math.hypot(b.position.x, b.position.z) > 2) g.add(b);
  }
  for (let k = 0; k < 6; k++) { // little trees
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 6), new THREE.MeshLambertMaterial({ color: 0x33c9ff, emissive: 0x115577 }));
    t.position.set(rand(-4.2, 4.2), 1.1, rand(3.2, 4.3) * (Math.random() < 0.5 ? -1 : 1)); g.add(t);
  }
  const body = new THREE.Group(); g.add(body);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 60, 12, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x33ff99, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
  beam.visible = false; g.add(beam);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.07, 6, 48), glow(0xffffff, 0.9)); ring.rotation.x = Math.PI / 2; g.add(ring);
  const [lo, el] = label("", "lbl"); g.add(lo);
  el.onclick = () => openWorker(w.name);
  scene.add(g);
  // link line to the vault
  const pts = [new THREE.Vector3(x, 0.5, z), new THREE.Vector3(0, 6, 8)];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x99bbff, transparent: true, opacity: 0.5 })));
  return { g, body, beam, ring, lo, el, height: 0, lift: (i % 2) * 3 };
}

function setTowerHeight(t, h) {
  if (Math.abs(t.height - h) < 0.5) return;
  t.height = h; t.body.clear();
  const tiers = [[3.4, h * 0.45], [2.6, h * 0.35], [1.8, h * 0.2]];
  let y = 0.6;
  for (const [wd, th] of tiers) { const b = building(wd, th, wd); b.position.y = y + th / 2; t.body.add(b); y += th; }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.2, 3, 6), new THREE.MeshBasicMaterial({ color: 0xbfe0ff }));
  spire.position.y = y + 1.5; t.body.add(spire);
  t.top = y; t.ring.position.y = y - 0.4; t.beam.position.y = y + 30; t.lo.position.set(0, y + 4 + t.lift, 0);
}

function placeDistricts(ws) {
  const names = [...new Set(ws.map((w) => w.district))];
  names.forEach((d, i) => {
    if (districts.has(d)) return;
    // alternate left/right of the towers, stacking upward, so signs never hide behind the title or labels
    const side = i % 2 ? 1 : -1, row = Math.floor(i / 2);
    const [o] = label(d, "sign" + (/0DTE/i.test(d) ? " red" : ""));
    o.position.set(side * (36 + row * 4), 7 + row * 7, -18 - row * 8); scene.add(o); districts.set(d, o);
  });
}

// ---------------------------------------------------------------- data -> scene
function render(s) {
  state = s;
  if (s.error) { $("#status").textContent = s.error; return; }
  placeDistricts(s.workers);
  s.workers.forEach((w, i) => {
    if (!towers.has(w.name)) towers.set(w.name, makeTower(w, i, s.workers.length));
    const t = towers.get(w.name);
    const pnl = w.pnl_today + w.unrealized;
    setTowerHeight(t, 8 + Math.max(-4, Math.min(16, pnl / 100)));
    const open = w.position;
    t.beam.visible = !!open;
    if (open) t.beam.material.color.set(open.right === "call" ? 0x33ff99 : 0xff4d6d);
    const what = open ? `${open.right === "call" ? "▲ CALL" : "▼ PUT"} ${open.qty}x · open ${money(w.unrealized)}` : w.status;
    t.el.className = "lbl" + (open ? (open.right === "put" ? " put" : "") : " idle");
    t.el.innerHTML = `<div class="n">${w.name}</div><div class="s">${what}</div><div class="p ${cls(w.pnl_today)}">earned ${money(w.pnl_today)}</div>`;
  });
  const v = s.vault;
  vaultEl.innerHTML = `<div class="h">THE VAULT · ${fmtDay(s.day)}</div><div class="v ${cls(v.today)}">${money(v.today)}</div>` +
    `<div class="f">${v.on_shift} workers on shift${v.closed ? " · CLOSED" : ""} · tap for payroll</div>`;
  $("#status").innerHTML = `<b>${s.city}</b> · ${s.mode} · ${s.asof ? new Date(s.asof).toLocaleString(undefined, { timeZone: "America/New_York", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET" : "—"}`;
  const ribbon = $("#ribbon");
  ribbon.innerHTML = s.history.map((h) => `<div class="chip${h.date === (selDay || s.day) ? " sel" : ""}" data-d="${h.date}">` +
    `<div class="d">${fmtDay(h.date)}</div><div class="v ${cls(h.pnl)}">${money(h.pnl)}</div></div>`).join("");
  ribbon.querySelectorAll(".chip").forEach((c) => (c.onclick = async () => { selDay = c.dataset.d; await load(); if (selWorker) openWorker(selWorker); }));
  if (!selDay) ribbon.scrollLeft = ribbon.scrollWidth;
  $("#tape").textContent = s.tape.slice(0, 12).join("   ·   ");
  if (selWorker && $("#panel").style.display === "block") openWorker(selWorker, true);
}

function fmtDay(d) {
  if (!d) return "";
  const dt = new Date(d + "T12:00:00");
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
}

// ---------------------------------------------------------------- panels
function openPayroll() {
  selWorker = null;
  const day = selDay || state.day;
  const rows = state.workers.map((w) => {
    const dl = w.days[day] || { pnl: 0, trades: [] };
    const wins = dl.trades.filter((t) => t.pnl > 0).length;
    return `<tr><td>${w.name}</td><td>${w.symbol}</td><td>${dl.trades.length}</td><td>${dl.trades.length ? Math.round((100 * wins) / dl.trades.length) : 0}%</td><td class="${cls(dl.pnl)}">${money(dl.pnl)}</td></tr>`;
  }).join("");
  $("#pbody").innerHTML = `<h2>Payroll · ${fmtDay(day)}</h2><table><tr><th>worker</th><th>sym</th><th>trades</th><th>win</th><th>pnl</th></tr>${rows}</table>`;
  $("#panel").style.display = "block";
}

function openWorker(name, keepScroll) {
  selWorker = name;
  const w = state.workers.find((x) => x.name === name); if (!w) return;
  const day = selDay || state.day;
  const dl = w.days[day] || { bars: [], trades: [], signals: [], opening_range: [null, null], pnl: 0 };
  const pos = w.position && day === state.day ? `<p>Open: <b>${w.position.contract}</b> ${w.position.qty}x @ ${w.position.entry} → ${w.position.mark} (${w.position.triggers.join("+")})</p>` : "";
  const trades = dl.trades.map((t) => `<tr><td>${t.opened}→${t.closed}</td><td class="${t.right === "call" ? "g" : "r"}">${t.right.toUpperCase()}</td><td>${t.triggers.join("+")}</td>` +
    `<td>${t.entry.toFixed(2)}→${t.exit.toFixed(2)}</td><td>${t.reason}</td><td class="${cls(t.pnl)}">${money(t.pnl)}</td></tr>`).join("");
  const sigs = dl.signals.map((s) => `<tr><td>${s.t}</td><td class="${s.dir === "call" ? "g" : "r"}">${s.dir.toUpperCase()}</td><td>${s.triggers.join("+")}</td><td>${s.price}</td></tr>`).join("");
  const sc = $("#panel").scrollTop;
  $("#pbody").innerHTML = `<h2>${w.name} · ${w.symbol}</h2><div class="muted">${fmtDay(day)} · ${w.district} · triggers ${w.triggers.join(", ")} · status ${w.status}</div>
    <div class="${cls(dl.pnl)}" style="font-size:18px;font-weight:800;margin-top:4px">${money(dl.pnl)}</div>${pos}
    <canvas id="chart"></canvas>
    <div class="legend"><span style="color:#e8f0ff">■ price</span><span style="color:#ffd84d">■ VWAP</span><span style="color:#c77dff">■ EMA 50</span><span style="color:#5fd3ff">▭ opening range</span><span class="g">▲ call</span><span class="r">▼ put</span></div>
    <h3>Trades</h3><table><tr><th>time</th><th>side</th><th>trigger</th><th>premium</th><th>exit</th><th>pnl</th></tr>${trades || '<tr><td colspan=6 class="muted">none</td></tr>'}</table>
    <h3>Signals</h3><table><tr><th>time</th><th>side</th><th>trigger</th><th>price</th></tr>${sigs || '<tr><td colspan=4 class="muted">none</td></tr>'}</table>`;
  $("#panel").style.display = "block";
  if (keepScroll) $("#panel").scrollTop = sc;
  drawChart($("#chart"), dl);
}
$("#close").onclick = () => { $("#panel").style.display = "none"; selWorker = null; };

function drawChart(cv, dl) {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const bars = dl.bars; if (!bars.length) { g.fillStyle = "#8fa3ff"; g.fillText("no bars", 10, 20); return; }
  const vals = bars.flatMap((b) => [b[1], b[2], b[3]]).concat(dl.opening_range).filter((v) => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const padv = (hi - lo) * 0.06 || 1; lo -= padv; hi += padv;
  const L = 44, R = 8, T = 8, B = 18, n = 390;
  // x is the minute of the session (09:30 = 0), so a bot started mid-day draws in the right place
  const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m - 570; };
  const X = (i) => L + (i / (n - 1)) * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  g.strokeStyle = "rgba(80,100,255,.25)"; g.fillStyle = "#8fa3ff"; g.font = "10px monospace";
  for (let k = 0; k <= 4; k++) { const v = lo + ((hi - lo) * k) / 4, y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); g.fillText(v.toFixed(2), 2, y + 3); }
  ["09:30", "11:00", "12:30", "14:00", "15:30"].forEach((t, k) => g.fillText(t, X(k * 90) - 12, H - 4));
  const [orh, orl] = dl.opening_range;
  if (orh != null) { g.fillStyle = "rgba(95,211,255,.12)"; g.fillRect(L, Y(orh), W - L - R, Y(orl) - Y(orh)); g.strokeStyle = "#5fd3ff"; g.setLineDash([4, 4]);
    for (const v of [orh, orl]) { g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - R, Y(v)); g.stroke(); } g.setLineDash([]); }
  const line = (k, c, w) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); let on = false;
    bars.forEach((b) => { const i = mins(b[0]); if (b[k] == null) { on = false; return; } on ? g.lineTo(X(i), Y(b[k])) : g.moveTo(X(i), Y(b[k])); on = true; }); g.stroke(); };
  line(2, "#ffd84d", 1.2); line(3, "#c77dff", 1.2); line(1, "#e8f0ff", 1.4);
  for (const t of dl.trades) { // shade each trade's holding period
    const a = mins(t.opened), b = mins(t.closed);
    g.fillStyle = t.pnl > 0 ? "rgba(51,255,153,.13)" : "rgba(255,77,109,.13)"; g.fillRect(X(a), T, Math.max(2, X(b) - X(a)), H - T - B);
  }
  for (const s of dl.signals) {
    const i = mins(s.t); const x = X(i), y = Y(s.price), up = s.dir === "call";
    g.fillStyle = up ? "#33ff99" : "#ff4d6d"; g.beginPath();
    if (up) { g.moveTo(x, y + 4); g.lineTo(x - 4, y + 11); g.lineTo(x + 4, y + 11); } else { g.moveTo(x, y - 4); g.lineTo(x - 4, y - 11); g.lineTo(x + 4, y - 11); }
    g.fill();
  }
}

// click towers in the 3D view
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null;
labels.domElement.addEventListener("pointerdown", (e) => (down = [e.clientX, e.clientY]));
labels.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  for (const h of ray.intersectObjects([...towers.values()].map((t) => t.g), true)) {
    let o = h.object; while (o && !o.userData.name) o = o.parent; if (o) return openWorker(o.userData.name);
  }
  if (ray.intersectObject(vault, true).length) openPayroll();
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  for (const tw of towers.values()) { tw.ring.rotation.z = t; tw.ring.scale.setScalar(1 + 0.08 * Math.sin(t * 2)); if (tw.beam.visible) tw.beam.material.opacity = 0.4 + 0.2 * Math.sin(t * 4); }
  dome.material.color.setHSL(0, 0, 0.9 + 0.1 * Math.sin(t * 1.5));
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
})();

// Only the day on screen is fetched (the full history of bars can be megabytes).
let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const q = selDay ? "?day=" + encodeURIComponent(selDay) : "";
    const r = await fetch("/api/state" + q, { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    const why = e.name === "AbortError" ? "no answer in 15 s" : e.message;
    $("#status").innerHTML = (state && !state.error ? $("#status").innerHTML.replace(/ · <span class="r">.*$/, "") + " · " : "") +
      `<span class="r">reconnecting… (${why}; is the server up and the SSH tunnel open?)</span>`;
  } finally { clearTimeout(timer); loading = false; }
}
(async function poll() { await load(); setTimeout(poll, 2000); })();
</script>
