<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a3d">
<title>Scalp City</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='10' width='6' height='18' fill='%235fd3ff'/><rect x='13' y='3' width='6' height='25' fill='%2333ff99'/><rect x='22' y='14' width='6' height='14' fill='%23ffd84d'/></svg>">
<style>
  :root {
    --bg: #070a3d; --ink: #e8eeff; --dim: #8f9be6; --grid: #2a3590; --line: #3446d8;
    --panel: rgba(8, 12, 58, .82); --panel-solid: #0a0f4a; --glass: rgba(14, 20, 90, .55);
    --up: #33ff99; --down: #ff4d6d; --gold: #ffd84d; --cyan: #5fd3ff; --grey: #8a8fb8;
    --vwap: #ffd84d; --ema: #c77dff; --or: #5fd3ff;
    --r: 12px; --gut: 12px; --safe-b: env(safe-area-inset-bottom, 0px);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--mono); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  kbd { font: 10px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); } .cyan { color: var(--cyan); } .flat { color: var(--ink); } .grey { color: var(--grey); }
  .muted { color: var(--dim); } .small { font-size: 11px; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels-layer { position: absolute; inset: 0; touch-action: none; }
  .no-labels .tower-label { display: none; }

  /* ---------- 3D labels ---------- */
  .tower-label { pointer-events: auto; cursor: pointer; min-width: 112px; padding: 5px 9px 6px; border-radius: 9px; text-align: center; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: border-color .2s, box-shadow .2s; }
  .tower-label:hover, .tower-label.selected { border-color: var(--gold); box-shadow: 0 0 22px rgba(255,216,77,.35); }
  .tower-label.dimmed { opacity: .35; } .tower-label.dimmed:hover { opacity: 1; }
  .tl-name { font-weight: 800; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tl-st { font-size: 11px; color: var(--dim); } .tl-pnl { font-weight: 800; }
  .sdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--grey); box-shadow: 0 0 8px currentColor; flex: none; }
  .sdot.up { background: var(--up); color: var(--up); } .sdot.down { background: var(--down); color: var(--down); } .sdot.gold { background: var(--gold); color: var(--gold); } .sdot.cyan { background: var(--cyan); color: var(--cyan); }
  .tbar { display: block; height: 4px; border-radius: 3px; background: rgba(120,140,255,.22); overflow: hidden; margin-top: 4px; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--up), var(--gold)); border-radius: 3px; transition: width .6s; }
  .tbar.neg i { background: var(--down); }
  .tbar.wide { width: 90px; display: inline-block; vertical-align: middle; margin: 0 6px 0 0; }
  .vault-label { pointer-events: auto; cursor: pointer; text-align: center; padding: 7px 16px 8px; border-radius: 10px; background: rgba(0,0,0,.72); border: 1.5px solid var(--gold); box-shadow: 0 0 30px rgba(255,216,77,.25); }
  .vault-label .tbar { width: 100%; }
  .vh { color: var(--gold); font-size: 10px; letter-spacing: 2px; font-weight: 800; } .vv { font-size: 26px; font-weight: 900; } .vf { color: var(--dim); font-size: 10px; margin-top: 3px; }

  /* ---------- top bar ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 8px var(--gut); background: linear-gradient(var(--panel), rgba(8,12,58,0)); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
  .brand b { font: 900 15px system-ui, sans-serif; letter-spacing: .5px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grey); flex: none; }
  .dot.ok { background: var(--up); box-shadow: 0 0 10px var(--up); animation: pulse 2s infinite; } .dot.replay { background: var(--cyan); } .dot.warn { background: var(--gold); } .dot.bad { background: var(--down); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #conn-text { color: var(--gold); font-size: 11px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #kpis { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: nowrap; overflow: hidden; min-width: 0; }
  .kpi { background: var(--glass); border: 1px solid var(--line); border-radius: 9px; padding: 3px 10px; display: flex; flex-direction: column; min-width: 78px; flex: none; }
  .kpi span { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); white-space: nowrap; } .kpi b { font-size: 15px; white-space: nowrap; } .kpi small { color: var(--dim); }
  .right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .market { font-size: 11px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); } .market.open { color: var(--up); border-color: rgba(51,255,153,.5); } .market.closed { color: var(--dim); }
  #clock { color: var(--dim); font-size: 12px; min-width: 84px; }
  .ib { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); transition: border-color .15s, background .15s; flex: none; }
  .ib:hover { border-color: var(--gold); background: rgba(40,50,150,.6); }
  .ib svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #rosterBtn { display: none; }

  /* ---------- settings ---------- */
  #settings { position: fixed; top: 54px; right: var(--gut); z-index: 9; width: 250px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  #settings[hidden] { display: none; }
  #settings h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .seg { display: flex; gap: 4px; margin-bottom: 12px; } .seg button { flex: 1; padding: 6px; border-radius: 7px; border: 1px solid var(--line); }
  .seg button.on, .tog.on { border-color: var(--gold); color: var(--gold); background: rgba(255,216,77,.08); }
  .tog { display: flex; justify-content: space-between; width: 100%; padding: 7px 8px; border-radius: 7px; border: 1px solid var(--line); margin-bottom: 6px; }
  .tog::after { content: "off"; color: var(--dim); } .tog.on::after { content: "on"; color: var(--gold); }

  /* ---------- roster ---------- */
  #roster { position: fixed; top: 64px; left: var(--gut); width: 238px; max-height: calc(100vh - 170px); overflow: auto; z-index: 4; scrollbar-width: thin; }
  .crew { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px 6px; margin-bottom: 6px; cursor: pointer; backdrop-filter: blur(6px); transition: border-color .15s, transform .15s; outline: none; }
  .crew:hover, .crew:focus-visible { border-color: var(--cyan); } .crew.selected { border-color: var(--gold); transform: translateX(3px); }
  .crew .r1, .crew .r2 { display: flex; align-items: center; gap: 6px; } .crew .r2 { justify-content: space-between; margin-top: 3px; }
  .crew .nm { color: var(--gold); white-space: nowrap; } .crew kbd { margin-left: 2px; } .crew .px { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }
  .crew .pnl { font-weight: 800; } .crew .r3 { display: flex; align-items: center; gap: 8px; } .crew .r3 .tbar { flex: 1; } .crew .r3 small { color: var(--dim); font-size: 10px; margin-top: 3px; white-space: nowrap; }
  .crew .spark { position: absolute; right: 70px; top: 26px; width: 56px; height: 14px; opacity: .6; pointer-events: none; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.cyan { color: var(--cyan); } .chip.up { color: var(--up); } .chip.down { color: var(--down); } .chip.gold { color: var(--gold); } .chip.grey { color: var(--grey); }

  /* ---------- panel ---------- */
  #panel { position: fixed; top: 64px; right: var(--gut); width: min(600px, calc(100vw - 2 * var(--gut))); max-height: calc(100vh - 170px); z-index: 6; display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 20px 60px rgba(0,0,0,.55); animation: slide .22s ease-out; }
  #panel[hidden] { display: none; }
  @keyframes slide { from { opacity: 0; transform: translateX(16px); } }
  #panel .close { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px; font-size: 18px; color: var(--dim); z-index: 1; }
  #panel .close:hover { color: var(--ink); background: var(--glass); }
  .pbody { overflow: auto; padding: 14px 16px 16px; scrollbar-width: thin; }
  .pbody h2 { margin: 0; font: 900 18px system-ui, sans-serif; color: var(--gold); } .pbody h2 small { font: 12px var(--mono); color: var(--dim); }
  .pbody h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-right: 34px; }
  .pr { text-align: right; } .big { font-size: 22px; font-weight: 900; } .big small { font-size: 12px; }
  .chartbox { height: 270px; margin: 12px 0 6px; border-radius: 10px; background: #060a36; border: 1px solid rgba(80,100,255,.25); }
  .chartbox.short { height: 200px; } .chartbox canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--dim); } .lg-c { color: var(--ink); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stat { background: var(--glass); border: 1px solid rgba(80,100,255,.3); border-radius: 8px; padding: 6px 8px; } .stat span { display: block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); } .stat b { font-size: 14px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-top: 12px; background: var(--glass); }
  .card.call { border-color: rgba(51,255,153,.55); box-shadow: inset 0 0 24px rgba(51,255,153,.08); } .card.put { border-color: rgba(255,77,109,.55); box-shadow: inset 0 0 24px rgba(255,77,109,.08); }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0; flex-wrap: wrap; }
  .slt { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 11px; }
  .slt .track { flex: 1; height: 6px; border-radius: 4px; position: relative; background: linear-gradient(90deg, var(--down), rgba(120,140,255,.35) 50%, var(--up)); }
  .slt .track i { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px; transform: translateX(-50%); }
  .slt .ent { background: var(--ink); opacity: .6; } .slt .mark { background: var(--gold); box-shadow: 0 0 8px var(--gold); transition: left .6s; }
  .mbar { display: inline-block; width: 90px; height: 6px; border-radius: 4px; background: rgba(120,140,255,.18); overflow: hidden; vertical-align: middle; } .mbar i { display: block; height: 100%; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-weight: 400; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  td, th { padding: 5px 6px; text-align: right; border-bottom: 1px solid rgba(80,100,255,.16); white-space: nowrap; } td:first-child, th:first-child { text-align: left; }
  tbody tr:hover { background: rgba(80,100,255,.08); } table.pay tr { cursor: pointer; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(120,140,255,.18); } .tag.target { color: var(--up); } .tag.stop { color: var(--down); } .tag.flip { color: var(--gold); }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--dim); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
  .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--dim); } .rules b { color: var(--ink); font-weight: 400; }
  .help { padding-left: 18px; } .help li { margin: 6px 0; } .keys { color: var(--dim); line-height: 2; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 8; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { background: var(--panel-solid); border: 1px solid var(--line); border-left: 4px solid var(--cyan); border-radius: 9px; padding: 7px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: drop .25s ease-out; transition: opacity .5s, transform .5s; white-space: nowrap; }
  .toast.win, .toast.call { border-left-color: var(--up); } .toast.loss, .toast.put { border-left-color: var(--down); } .toast small { color: var(--dim); }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px); } }

  /* ---------- bottom ---------- */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding-bottom: var(--safe-b); background: linear-gradient(rgba(8,12,58,0), var(--panel) 40%); }
  #ribbon { display: flex; gap: 6px; padding: 8px var(--gut) 6px; overflow-x: auto; scrollbar-width: none; align-items: flex-end; }
  #ribbon::-webkit-scrollbar { display: none; }
  .chip-total { flex: none; padding: 4px 10px; border-right: 1px solid var(--line); margin-right: 4px; display: flex; flex-direction: column; } .chip-total span { color: var(--dim); font-size: 10px; white-space: nowrap; } .chip-total b { font-size: 15px; white-space: nowrap; }
  .day { flex: none; position: relative; min-width: 88px; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 9px 7px; overflow: hidden; transition: border-color .15s, transform .15s; }
  .day:hover { border-color: var(--cyan); transform: translateY(-2px); } .day.sel { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,216,77,.35); }
  .day .d { display: block; color: var(--dim); font-size: 10px; white-space: nowrap; } .day b { font-size: 13px; white-space: nowrap; }
  .day i { position: absolute; left: 0; right: 0; bottom: 0; opacity: .5; } .day i.up { background: var(--up); } .day i.down { background: var(--down); }
  .day.live .d::after { content: " ● live"; color: var(--up); }
  #tape { height: 28px; overflow: hidden; border-top: 1px solid var(--line); background: rgba(2,4,30,.92); white-space: nowrap; font-size: 12px; }
  .tape-inner { display: inline-block; padding: 6px 0; animation: tape 90s linear infinite; color: var(--dim); }
  .tape-inner span { margin: 0 6px; } .tape-inner .sep { color: var(--line); }
  #tape:hover .tape-inner { animation-play-state: paused; }
  @keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .fab { position: fixed; right: var(--gut); bottom: calc(96px + var(--safe-b)); z-index: 4; }
  body.panel-open .fab { display: none; }

  /* ---------- phone ---------- */
  @media (max-width: 700px) {
    :root { --gut: 10px; }
    #top { flex-wrap: wrap; gap: 6px 8px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
    .brand { flex: 1; } .badge, #clock, .market { display: none; }
    #kpis { order: 3; flex-basis: 100%; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    #kpis::-webkit-scrollbar { display: none; }
    .kpi { min-width: 0; padding: 2px 8px; } .kpi b { font-size: 13px; }
    .right { gap: 6px; } .ib { width: 32px; height: 32px; }
    #rosterBtn { display: grid; }
    #roster { top: auto; bottom: calc(92px + var(--safe-b)); left: 0; right: 0; width: auto; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding: 0 var(--gut); scrollbar-width: none; }
    #roster::-webkit-scrollbar { display: none; }
    #roster-list { display: flex; gap: 6px; }
    .crew { flex: none; width: 172px; margin: 0; } .crew .spark, .crew kbd { display: none; }
    body:not(.roster-open) #roster { display: none; }
    #panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 80vh; border-radius: 16px 16px 0 0; animation: rise .25s ease-out; padding-bottom: var(--safe-b); }
    @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
    .hide-sm { display: none; } table { font-size: 11px; } td, th { padding: 5px 4px; }
    .chartbox { height: 220px; } .grid4 { grid-template-columns: repeat(2, 1fr); } .rules { grid-template-columns: 1fr; }
    .tower-label { min-width: 0; padding: 3px 6px 4px; font-size: 10px; } .tl-st { font-size: 9px; }
    .vv { font-size: 18px; } .vault-label { padding: 4px 10px 5px; } .vault-label .vf, .vault-label .tbar { display: none; } .vh { font-size: 9px; letter-spacing: 1px; }
    #toasts { top: 104px; width: calc(100% - 20px); } .toast { white-space: normal; }
    body.roster-open .fab { bottom: calc(190px + var(--safe-b)); }
    #settings { top: 100px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>

<header id="top">
  <div class="brand">
    <span class="dot" id="conn"></span><b id="cityName">Scalp City</b><span class="badge" id="mode">—</span><span id="conn-text"></span>
  </div>
  <div id="kpis"><span class="muted">connecting…</span></div>
  <div class="right">
    <span class="market" id="market"></span><span id="clock"></span>
    <button class="ib" id="rosterBtn" data-act="roster" title="Bots" aria-label="Bots"><svg viewBox="0 0 24 24"><rect x="3" y="10" width="4" height="11"/><rect x="10" y="3" width="4" height="18"/><rect x="17" y="13" width="4" height="8"/></svg></button>
    <button class="ib" data-act="stats" title="Performance (S)" aria-label="Performance"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg></button>
    <button class="ib" data-act="payroll" title="Payroll (P)" aria-label="Payroll"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M3 10h2M19 15h2"/></svg></button>
    <button class="ib" data-act="help" title="Help (H)" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg></button>
    <button class="ib" data-act="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </div>
</header>

<div id="settings" hidden>
  <h4>Graphics</h4>
  <div class="seg"><button data-set="quality=high">High</button><button data-set="quality=medium">Medium</button><button data-set="quality=low">Low</button></div>
  <button class="tog" data-set="labels">Tower labels</button>
  <button class="tog" data-set="autoRotate">Auto-orbit</button>
  <button class="tog" data-set="toasts">Trade pop-ups</button>
  <button class="tog" data-set="sound">Sound on trades</button>
  <p class="muted small">Low turns off the bloom glow, for older phones.</p>
</div>

<aside id="roster"><div id="roster-list"></div></aside>
<section id="panel" hidden><button class="close" aria-label="Close">×</button><div class="pbody"></div></section>
<div id="toasts"></div>
<button class="ib fab" data-act="reset" title="Reset view (R)" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>

<footer id="bottom">
  <div id="ribbon"></div>
  <div id="tape"><div class="tape-inner"></div></div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
