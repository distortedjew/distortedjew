<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Real-time monitoring terminal for the AI trading bot." />
    <title>AI Trading Bot</title>
    <script>
      // Apply the saved theme before first paint (dark is the default) so there is no flash.
      (function () {
        try {
          var dark = localStorage.getItem("tradebot.theme") !== "light";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#07090d" : "#f5f7fb");
        } catch (e) {
          /* storage unavailable: keep dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
