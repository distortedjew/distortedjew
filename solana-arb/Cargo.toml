[package]
name = "solana-arbitrage-bot"
version = "0.1.0"
edition = "2021"
description = "Solana on-chain arbitrage bot with profit gating and Jito bundle sending"
# Forked from https://github.com/ChangeYourself0613/Solana-Arbitrage-Bot (solana-arbitrage-bot2.0)
license = "MIT"

[lib]
name = "solana_arbitrage_bot"
path = "src/lib.rs"

[dependencies]
# Core Solana dependencies
solana-sdk = "1.17"
solana-client = "1.17"
solana-program = "1.17"
solana-account-decoder = "1.17"
solana-transaction-status = "1.17"

# SPL token support
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.0.5", features = [
    "no-entrypoint",
] }

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"

# Async runtime
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
bs58 = "0.4"
borsh = "0.10.3"
bytemuck = { version = "1.16.1", features = ["derive"] }

# Command line argument parsing
clap = "3.2"

# HTTP (Jito block engine) and encoding
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
base64 = "0.21"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
